name: Build Citizen Guilds
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: '21'
   - uses: gradle/actions/setup-gradle@v4
     with:
      gradle-version: '8.10.2'
   - name: Validate JSON resources
     run: |
      python3 - <<'PY'
      import json
      from pathlib import Path
      files = list(Path("src/main/resources").rglob("*.json"))
      for path in files:
          json.loads(path.read_text(encoding="utf-8"))
      print(f"Validated {len(files)} JSON resource files.")
      PY
   - name: Build mod
     run: gradle build --no-daemon
   - name: Verify packaged dungeon resources
     run: |
      jar_file=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*sources*' | head -n 1)
      test -n "$jar_file"
      jar tf "$jar_file" | grep -q "data/citizenguilds/dimension/dungeon.json"
      jar tf "$jar_file" | grep -q "data/citizenguilds/recipes/jade_helmet.json"
   - name: Smoke test dedicated server startup
     run: |
      mkdir -p run
      printf "eula=true\n" > run/eula.txt
      printf "online-mode=false\nserver-port=25565\nlevel-name=world\n" > run/server.properties
      set +e
      timeout --signal=TERM --kill-after=10s 45s gradle runServer --no-daemon --console=plain > /tmp/citizen-server-smoke.log 2>&1
      status=$?
      set -e
      tail -n 100 /tmp/citizen-server-smoke.log
      if [ "$status" -ne 124 ] && [ "$status" -ne 137 ] && [ "$status" -ne 0 ]; then
        exit "$status"
      fi
      test -f run/logs/latest.log
      grep -q "Done (" run/logs/latest.log
      if grep -qi "Failed to load datapacks" run/logs/latest.log; then
        exit 1
      fi
   - uses: actions/upload-artifact@v4
     with:
      name: CitizenGuilds
      path: build/libs/*.jar
